# Builds, format-checks and tests the .NET API on every PR that touches the backend.
name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

# A new push to the same PR cancels the run that is already going.
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Backend (build, format, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore Starter.slnx

      - name: Check formatting
        run: dotnet format Starter.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Starter.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Starter.slnx --no-build --configuration Release
